[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "columnar-analytics-engine"
version = "0.1.0"
description = "Columnar analytics engine with a SQL subset and vectorised execution"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
columnar-analytics-engine = "columnar_analytics.cli:main"

[tool.setuptools]
packages = ["columnar_analytics"]
